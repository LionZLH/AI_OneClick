name: Windows 构建与测试

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 单元测试（推荐引擎、软件目录）
        run: node --test tests/recommend.test.cjs tests/catalog.test.cjs

      - name: 用 Windows 自带的 csc.exe 编译
        shell: cmd
        run: build.cmd

      - name: 确保 winget 可用
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers -Force -Latest
          }
          winget --version

      - name: 自检（硬件、注册表、开始菜单、winget、网络）
        shell: pwsh
        run: |
          $p = Start-Process dist\AIStation.exe -ArgumentList '--selftest', "$pwd\selftest.json" -Wait -PassThru
          Get-Content selftest.json -Raw -Encoding UTF8 | ConvertFrom-Json | ConvertTo-Json -Depth 6
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 核对 winget / Store 包 ID
        shell: pwsh
        run: tests/check-winget-ids.ps1

      - name: 真实安装 → 识别 → 启动 → 卸载
        timeout-minutes: 20
        shell: pwsh
        run: tests/real-install.ps1 -AppId jan

      - name: 界面端到端测试（真实 winget）
        timeout-minutes: 20
        if: always()
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node tests/e2e.mjs --exe dist/AIStation.exe --real --out test-results

      - name: 安装到本机 → 卸载 AI Station 本身
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: tests/self-install.ps1

      - name: 一键准备本地 AI（真实安装 Ollama 并下载小模型）
        if: always()
        timeout-minutes: 20
        shell: pwsh
        run: tests/real-ollama.ps1

      - name: 探查 LM Studio 命令行工具
        if: always()
        timeout-minutes: 12
        shell: pwsh
        run: tests/probe-lmstudio.ps1
        continue-on-error: true

      - name: 窗口冒烟测试（托盘 + Edge 应用窗口截图）
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: tests/window-smoke.ps1
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIStation-exe
          path: dist/AIStation.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results
            selftest.json

  release:
    # 推送 v* 标签时（如 v2.0.0），把编译好的 AIStation.exe 发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIStation-exe
      - uses: softprops/action-gh-release@v2
        with:
          files: AIStation.exe
          generate_release_notes: true
